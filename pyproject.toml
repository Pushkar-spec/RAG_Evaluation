[project]
name = "rag-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pushkar Tiwari", email = "pushkar.bpl20@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.3.3",
    "google-genai>=3.1.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.7",
    "langchain-google-genai>=4.4.3",
    "langchain-text-splitters>=1.1.3",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag-eval = "rag_eval:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
